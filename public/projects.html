<!doctype html>
<html lang="ru">
<head>
  <title>Проекты домов</title>
  <meta name="description" content="Каталог проектов домов: фото, планировки, площадь и стоимость строительства.">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // Сайт работает только через сервер. Если файл открыт напрямую — показываем подсказку.
    if (location.protocol === 'file:') document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML = '<div style="font:16px/1.6 system-ui,sans-serif;max-width:640px;margin:10vh auto;padding:32px;border-radius:16px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.12);color:#1f2428">' +
        '<h1 style="margin:0 0 12px;font-size:26px">Сайт нужно запускать через сервер</h1>' +
        '<p>Вы открыли файл напрямую, поэтому стили, проекты и калькулятор не загрузились.</p>' +
        '<ol style="padding-left:20px"><li>Установите <a href="https://nodejs.org/ru/download">Node.js</a> (версия LTS), если ещё не установлен.</li>' +
        '<li>В папке сайта дважды щёлкните <b>start-windows.bat</b> (Windows) или <b>start-mac.command</b> (Mac).</li>' +
        '<li>Сайт откроется по адресу <b>http://localhost:3000</b>, админка — <b>http://localhost:3000/admin</b>.</li></ol></div>';
      document.body.style.cssText = 'background:#f6f3ef;padding:16px;animation:none';
    });
  </script>
</head>
<body class="has-hero">
  <header class="header" data-header></header>
  <section class="page-hero">
    <div class="blob blob--1"></div>
    <div class="container">
      <span class="eyebrow fade-up">Каталог</span>
      <h1 data-split>Проекты домов</h1>
      <p class="fade-up" style="--d:400ms">Реализованные и типовые проекты. Нажмите на карточку, чтобы посмотреть фото и описание.</p>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <div class="filters" data-filters></div>
      <div class="grid grid--3" data-list>
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>
  </section>
  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="cta">
        <h2>Не нашли подходящий проект?</h2>
        <p>Разработаем индивидуальный проект под ваш участок и бюджет.</p>
        <button class="btn" data-open-callback="Индивидуальный проект">Получить консультацию <span class="btn__arrow">→</span></button>
      </div>
    </div>
  </section>
  <footer class="footer" data-footer></footer>
  <script src="/vendor/lenis.min.js"></script>
  <script src="/js/motion.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/projects.js"></script>
</body>
</html>
